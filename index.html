  <!-- Performance: the hero portrait is the LCP element on the home page. Preloaded with the same
       srcset/sizes the <picture> uses; added only on "/" so /projects and 404s don't fetch it unused. -->
  <script>
    if (location.pathname === "/") {
      var preload = document.createElement("link");
      preload.rel = "preload";
      preload.as = "image";
      preload.type = "image/webp";
      preload.href = "/profile.webp";
      preload.setAttribute("imagesrcset", "/profile-sm.webp 420w, /profile.webp 700w");
      preload.setAttribute("imagesizes", "(min-width: 1024px) 416px, 80vw");
      preload.setAttribute("fetchpriority", "high");
      document.head.appendChild(preload);
    }
  </script>

  <!-- Fonts: preconnect, then load the stylesheet without blocking first paint (display=swap) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link

  <!-- Apply the saved/system theme before first paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      var theme = "light";
      try {
        var stored = localStorage.getItem("portfolio-theme");
        if (stored === "dark" || stored === "light") theme = stored;
        else if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
      } catch (e) {
        /* storage unavailable (private mode) — fall back to light */
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    html { background: #fbfbfd; }
    html[data-theme="dark"] { background: #0a0c12; }
  </style>
